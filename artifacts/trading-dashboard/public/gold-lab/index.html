<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شارت الذهب المباشر</title>
<style>
  html:not([data-access-approved="true"]) body { visibility: hidden !important; }
</style>
<script>
  (async function () {
    try {
      var response = await fetch("/api/access/status", { credentials: "same-origin", cache: "no-store" });
      var status = await response.json();
      if (response.ok && status.authorized === true) {
        document.documentElement.setAttribute("data-access-approved", "true");
        return;
      }
    } catch (error) {}
    window.location.replace("/");
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Reem+Kufi:wght@600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
/* Layout: terminal-style full-height page. Header with live price, a timeframe strip (month to 1 minute), then the chart filling the rest. */
:root {
  --bg: #131722;
  --hover: #2a2e39;
  --sel: rgba(41,98,255,.18);
  --acc: #5b8cff;
  --panel: #1e222d;
  --line: #2a2e39;
  --fg: #d1d4dc;
  --mute: #787b86;
  --gold: #2962ff;
  --gold-soft: rgba(41, 98, 255, 0.14);
  --up: #089981;
  --down: #f23645;
  --font-ui: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --font-display: "Reem Kufi", "IBM Plex Sans Arabic", Tahoma, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 12px;
  overflow-x: hidden;
}
.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  gap: 12px;
  max-width: 1600px;
  margin-inline: auto;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* header */
.head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px 24px;
}
.title-block { min-width: 0; }
.title {
  font-family: var(--font-display);
  font-size: 22px;
  color: var(--gold);
  margin: 0;
  line-height: 1.2;
}
.sub { color: var(--mute); font-size: 12px; margin-top: 2px; }
.price-block { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; direction: ltr; }
.price {
  font-family: var(--font-num);
  font-weight: 600;
  font-size: 40px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  transition: color 0.25s;
}
.price.up { color: var(--up); }
.price.down { color: var(--down); }
.chg {
  font-family: var(--font-num);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--panel);
  border: 1px solid var(--line);
}
.chg.up { color: var(--up); }
.chg.down { color: var(--down); }
.stats { display: flex; gap: 20px; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; gap: 0; }
.stat span:first-child { color: var(--mute); font-size: 11px; letter-spacing: 0.02em; }
.stat span:last-child { font-family: var(--font-num); font-size: 13px; font-variant-numeric: tabular-nums; direction: ltr; text-align: right; }

/* toolbar */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-block: 1px solid var(--line);
  padding-block: 6px;
  min-width: 0;
}
.tfs {
  display: flex;
  gap: 2px;
  overflow-x: auto;
  scrollbar-width: none;
  min-width: 0;
  flex: 1 1 auto;
}
.tfs::-webkit-scrollbar { display: none; }
.tf, .type-btn {
  background: transparent;
  border: 0;
  border-bottom: 2px solid transparent;
  padding: 6px 12px;
  cursor: pointer;
  color: var(--mute);
  white-space: nowrap;
  font-weight: 500;
  border-radius: 4px 4px 0 0;
}
.tf:hover, .type-btn:hover { color: var(--fg); background: var(--panel); }
.tf[aria-selected="true"] { color: var(--gold); border-bottom-color: var(--gold); background: var(--gold-soft); }
.types { display: flex; gap: 2px; flex: none; }
.type-btn[aria-pressed="true"] { color: var(--fg); background: var(--panel); border-bottom-color: var(--line); }

/* chart */
.chart-wrap {
  position: relative;
  min-height: 0;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
}
#chart { position: absolute; inset: 0; direction: ltr; }
.legend {
  position: absolute;
  top: 8px;
  left: 10px;
  z-index: 3;
  direction: ltr;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  font-family: var(--font-num);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  color: var(--mute);
  pointer-events: none;
  max-width: calc(100% - 20px);
}
.legend b { font-weight: 500; color: var(--fg); }
.legend .up { color: var(--up); }
.legend .down { color: var(--down); }
.overlay {
  position: absolute;
  inset: 0;
  z-index: 4;
  display: grid;
  place-items: center;
  background: rgba(14, 13, 10, 0.72);
  text-align: center;
  padding: 24px;
}
.overlay[hidden] { display: none; }
.overlay p { margin: 0 0 12px; max-width: 34ch; }
.retry {
  background: var(--gold);
  color: #1a1407;
  border: 0;
  border-radius: 4px;
  padding: 8px 18px;
  font-weight: 600;
  cursor: pointer;
}

[hidden] { display: none !important; }
.tools { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ict-btn { font-family: var(--font-num); font-weight: 600; letter-spacing: 0.04em; }
.ict-btn[aria-pressed="true"] { color: #1a1407; background: var(--gold); border-bottom-color: var(--gold); }
.ictbar { display: flex; flex-direction: column; gap: 6px; padding-bottom: 2px; min-width: 0; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  border: 1px solid var(--line); background: var(--panel); color: var(--mute);
  border-radius: 999px; padding: 3px 11px; font-size: 12px; cursor: pointer; white-space: nowrap;
  direction: ltr; font-family: var(--font-num);
}
.chip i { width: 9px; height: 9px; border-radius: 2px; background: var(--sw); }
.chip[aria-pressed="true"] { color: var(--fg); border-color: var(--sw); }
.chip[aria-pressed="false"] i { opacity: 0.3; }
.ictsum { font-size: 12.5px; color: var(--fg); line-height: 1.6; }
.ictsum .note { color: var(--mute); font-size: 11px; display: block; }
.lybtn { margin-top: 6px; display: inline-flex; align-items: center; gap: 6px; background: transparent; border: 1px solid var(--line); color: var(--mute); border-radius: 999px; padding: 2px 12px; font-size: 12px; cursor: pointer; font-family: inherit; }
.lybtn:hover { color: var(--fg); border-color: var(--gold); }
.pgrid { display: none; position: relative; min-height: 0; }
body.multi .pgrid { display: block; }
body.multi .tools, body.multi .chart-wrap { display: none; }
body.multi .app { grid-template-rows: auto minmax(0, 1fr) auto; }
.pcell { position: absolute; padding: 2px; }
.pcell iframe { width: 100%; height: 100%; display: block; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
body.pane { padding: 0; overflow: hidden; }
body.pane .app { max-width: none; gap: 4px; grid-template-rows: auto minmax(0, 1fr); }
body.pane .head, body.pane .foot { display: none; }
body.pane .tools { padding-inline: 6px; }
body.pane .toolbar { padding-block: 1px; gap: 0 8px; flex-wrap: wrap; }
body.pane .tf, body.pane .type-btn { padding: 3px 8px; font-size: 12px; }
body.pane .tfs { order: 2; flex: 1 1 100%; }
body.pane .types { overflow-x: auto; max-width: 100%; }
body.pane .chart-wrap { border-radius: 0; border-inline: 0; }
.lymenu { position: fixed; z-index: 60; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px 12px; overflow-y: auto; box-shadow: 0 10px 32px rgba(0, 0, 0, 0.55); direction: rtl; scrollbar-width: thin; }
.lymenu[hidden] { display: none; }
.lyh { color: var(--mute); font-size: 11px; letter-spacing: 0.04em; margin: 4px 0 6px; }
.lyr { display: flex; align-items: center; gap: 10px; padding: 4px 0; border-top: 1px solid var(--line); }
.lyn { width: 22px; color: var(--mute); font-family: var(--font-num); font-size: 12px; text-align: center; flex: none; }
.lyi { display: flex; flex-wrap: wrap; gap: 4px; direction: ltr; }
.lyb { background: transparent; border: 1px solid transparent; color: var(--mute); border-radius: 5px; padding: 3px; cursor: pointer; line-height: 0; }
.lyb:hover { color: var(--fg); background: var(--gold-soft); }
.lyb[aria-pressed="true"] { color: var(--gold); border-color: var(--gold); background: var(--gold-soft); }
.lys { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px; background: transparent; border: 0; color: var(--fg); padding: 7px 2px; cursor: pointer; font-size: 13px; font-family: inherit; }
.lys i { direction: ltr; width: 34px; height: 18px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background 0.15s; }
.lys i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--fg); transition: left 0.15s; }
.lys[aria-checked="true"] i { background: var(--gold); }
.lys[aria-checked="true"] i::after { left: 18px; background: #1a1407; }
#dr { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
.chart-wrap.drawing #chart, .chart-wrap.drawing #chart * { cursor: crosshair !important; }
.chart-wrap.drhover #chart, .chart-wrap.drhover #chart * { cursor: pointer !important; }
.drmenu { position: fixed; z-index: 50; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-y: auto; box-shadow: 0 10px 32px rgba(0, 0, 0, 0.55); direction: rtl; scrollbar-width: thin; }
.drmenu[hidden] { display: none; }
.drgt { color: var(--mute); font-size: 11px; margin: 6px 2px 4px; letter-spacing: 0.02em; }
.drgi { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
.drt { display: flex; align-items: center; gap: 8px; text-align: start; background: transparent; border: 1px solid transparent; color: var(--fg); border-radius: 6px; padding: 5px 8px; font-size: 12.5px; cursor: pointer; font-family: inherit; }
.drt b { width: 20px; text-align: center; color: var(--gold); font-family: var(--font-num); font-weight: 600; flex: none; }
.drt:hover { background: var(--gold-soft); }
.drt[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-soft); }
.drstyle { position: absolute; z-index: 6; left: 50%; bottom: 40px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 16px); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5); direction: ltr; }
.drstyle[hidden] { display: none; }
.drc { width: 17px; height: 17px; border-radius: 50%; background: var(--c); border: 2px solid transparent; padding: 0; cursor: pointer; }
.drc[aria-pressed="true"] { border-color: #fff; }
.drstyle select { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; font-size: 11.5px; padding: 1px 3px; font-family: inherit; }
.drstyle select[hidden] { display: none; }
.drb { background: transparent; border: 1px solid var(--line); color: var(--fg); border-radius: 5px; padding: 0 7px; font-size: 13px; cursor: pointer; line-height: 20px; }
.drb:hover { border-color: var(--gold); }
.drb[hidden] { display: none; }
#ict { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

.rpbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 12.5px; padding-block: 2px; min-width: 0; }
.rpinfo { color: var(--gold); font-family: var(--font-num); direction: ltr; unicode-bidi: plaintext; }
.rpctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-width: 0; }
.rpgrp { display: flex; direction: ltr; gap: 4px; }
.rpb {
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
  padding: 4px 12px; cursor: pointer; color: var(--fg); min-width: 64px;
}
.rpb:hover { border-color: var(--gold); }
.rpb[aria-pressed="true"] { background: var(--gold); color: #1a1407; border-color: var(--gold); }
.rpbar label { display: inline-flex; align-items: center; gap: 6px; color: var(--mute); }
.rpbar select {
  background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 4px;
  padding: 3px 6px; font: inherit; font-family: var(--font-num);
}
.status[data-s="replay"] .dot { background: var(--gold); }

.ewbar { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ewctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--mute); font-size: 12px; }
.pills { display: inline-flex; gap: 6px; direction: ltr; }
.pill { font-family: var(--font-num); font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--mute); }
.pill.up { color: var(--up); border-color: var(--up); }
.pill.down { color: var(--down); border-color: var(--down); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { background: var(--panel); border: 0; padding: 3px 12px; cursor: pointer; color: var(--mute); border-inline-start: 1px solid var(--line); }
.seg button:first-child { border-inline-start: 0; }
.seg button[aria-pressed="true"] { background: #7aa2ff; color: #0b1020; font-weight: 600; }
@media (max-width: 720px) {
  .toolbar { flex-wrap: wrap; }
  .tfs { order: 2; flex: 1 1 100%; }
  .types { overflow-x: auto; max-width: 100%; }
}

.rt { display: inline-block; font-family: var(--font-num); font-size: 11.5px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); direction: ltr; }
.rt.ok { color: var(--up); border-color: var(--up); }
.rt.no { color: #e0b84f; border-color: #e0b84f; }
.badge { display: inline-block; font-size: 11.5px; padding: 0 8px; border-radius: 4px; border: 1px solid var(--line); }
.badge.ok { color: var(--up); border-color: var(--up); }
.badge.mid { color: #f08a4b; border-color: #f08a4b; }
.badge.mute { color: var(--mute); }
.badge.bad { color: var(--down); border-color: var(--down); }

.fpwrap { position: absolute; top: 34px; left: 10px; z-index: 5; display: flex; flex-direction: column; gap: 8px; width: min(340px, calc(100% - 20px)); max-height: calc(100% - 44px); overflow: auto; pointer-events: none; direction: rtl; }
.fp { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; font-size: 12px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45); }
.fp[hidden] { display: none !important; }
.fphead { display: flex; align-items: center; justify-content: space-between; color: var(--gold); font-family: var(--font-num); }
.fpx { background: transparent; border: 0; color: var(--mute); cursor: pointer; padding: 0 4px; font-size: 14px; }
.fpx:hover { color: var(--fg); }
.fp .chips { flex-wrap: wrap; overflow: visible; }
.fp .ewctl { gap: 6px 8px; }
.fpbtns { position: absolute; top: 6px; right: 72px; z-index: 5; display: flex; gap: 6px; direction: ltr; }
.fpb { background: var(--panel); border: 1px solid var(--line); color: var(--mute); border-radius: 999px; padding: 2px 10px; font-family: var(--font-num); font-size: 11.5px; cursor: pointer; }
.fpb[aria-pressed="true"] { color: var(--gold); border-color: var(--gold); }
.fp { max-height: 62vh; overflow-y: auto; scrollbar-width: thin; }
.hmempty { color: var(--mute); font-size: 11.5px; }
.ictsum hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
.fpb[hidden] { display: none !important; }
.fp .chip { padding: 2px 9px; font-size: 11.5px; }
.fp .seg button { padding: 2px 10px; }
@media (min-width: 900px) {
  .fpwrap { flex-direction: row; align-items: flex-start; width: auto; max-width: calc(100% - 20px); }
  .fp { width: 292px; flex: none; }
}

/* footer */
.foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 16px;
  color: var(--mute);
  font-size: 11.5px;
}
.status { display: inline-flex; align-items: center; gap: 6px; color: var(--fg); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); }
.status[data-s="live"] .dot { background: var(--up); animation: pulse 1.6s ease-out infinite; }
.status[data-s="loading"] .dot { background: var(--gold); }
.status[data-s="off"] .dot { background: var(--down); }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(63, 182, 139, 0.55); }
  100% { box-shadow: 0 0 0 8px rgba(63, 182, 139, 0); }
}
@media (prefers-reduced-motion: reduce) {
  .status[data-s="live"] .dot { animation: none; }
  .price { transition: none; }
}
@media (max-width: 560px) {
  .price { font-size: 32px; }
  .title { font-size: 19px; }
  .stats { gap: 14px; }
}
/* ===== TradingView-style shell ===== */
html, body { background: var(--bg); }
body { padding: 0; overflow: hidden; }
.app.tv { direction: ltr; max-width: none; gap: 0; height: 100%; grid-template-rows: auto auto minmax(0, 1fr) auto; }
.tv .chart-wrap { border: 0; border-radius: 0; background: var(--bg); flex: 1 1 auto; min-width: 0; }
.tvtop { display: flex; align-items: center; gap: 2px; height: 48px; padding: 0 8px; background: var(--bg); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
.tvtop::-webkit-scrollbar { display: none; }
.tvtop .sep { width: 1px; height: 24px; background: var(--line); margin: 0 6px; flex: none; }
.tvtop .grow { flex: 1 1 auto; min-width: 8px; }
.tvb { display: inline-flex; align-items: center; gap: 6px; height: 36px; min-width: 36px; padding: 0 8px; justify-content: center; background: transparent; border: 0; border-radius: 6px; color: var(--fg); cursor: pointer; font-family: var(--font-ui); font-size: 14px; font-weight: 500; flex: none; }
.tvb:hover { background: var(--hover); }
.tvb[aria-pressed="true"], .tvb.on { background: var(--sel); color: var(--acc); }
.tvb svg, .tvl svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.tvb.sym { background: var(--panel); border: 1px solid transparent; padding: 0 12px; font-weight: 700; letter-spacing: .02em; border-radius: 18px; }
.tvb.sym svg { width: 18px; height: 18px; }
.tvb.sym:hover { background: var(--hover); }
.tvtop .tfs { flex: none; overflow: visible; gap: 0; }
.tf { background: transparent; border: 0; border-radius: 6px; height: 36px; min-width: 34px; padding: 0 8px; font-size: 14px; font-weight: 500; color: var(--fg); cursor: pointer; font-family: var(--font-ui); }
.tf:hover { background: var(--hover); color: var(--fg); }
.tf[aria-selected="true"] { background: var(--sel); color: var(--acc); border: 0; }
.tvtop .price-block { gap: 8px; margin: 0 6px; }
.tvtop .price { font-size: 15px; font-weight: 600; color: var(--fg); }
.tvtop .chg { font-size: 12px; padding: 1px 6px; background: transparent; border: 0; }
.tv .price.up, .tv .chg.up { color: var(--up); } .tv .price.down, .tv .chg.down { color: var(--down); }
.tvmain { display: flex; min-height: 0; min-width: 0; }
.tvleft { width: 52px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; background: var(--bg); border-right: 1px solid var(--line); overflow-y: auto; scrollbar-width: none; position: relative; z-index: 7; }
.tvleft::-webkit-scrollbar { display: none; }
.tvl { width: 40px; height: 40px; display: grid; place-items: center; background: transparent; border: 0; border-radius: 6px; color: #b2b5be; cursor: pointer; flex: none; position: relative; }
.tvl:hover { background: var(--hover); color: var(--fg); }
.tvl[aria-pressed="true"] { background: var(--sel); color: var(--acc); }
.tvl i { position: absolute; right: 3px; bottom: 7px; border: 3px solid transparent; border-right-color: #787b86; border-bottom-color: #787b86; }
.tvl.lk svg { stroke-width: 1.5; }
.tvleft .sp { width: 32px; height: 1px; background: var(--line); margin: 5px 0; flex: none; }
.tvleft .fl { flex: 1 1 auto; }
.tvbot { display: flex; align-items: center; height: 38px; padding: 0 8px 0 60px; background: var(--bg); border-top: 1px solid var(--line); gap: 2px; direction: ltr; overflow-x: auto; scrollbar-width: none; }

      h += "<button type='button' class='scrow' data-i='" + i + "'><span class='sc-s' style='--c:" + SCAN_SCH[r.school][1] + "'>" + SCAN_SCH[r.school][0] + "</span><span class='sc-n' dir='auto'>" + (r.nat ? "<span class='nat " + r.nat.cls + "'>" + r.nat.t + "</span>" : "") + r.name + "</span><span class='sc-t'>" + (TV_LBL[r.tf] || r.tf) + "</span><span class='sc-d " + (r.dir > 0 ? "up" : "down") + "'>" + (r.dir > 0 ? "▲" : "▼") + "</span><span class='sc-st'>" + (r.st || "") + "</span><span class='sc-v " + cl + "' title='" + SCAN_TIP[r.school] + "'><i style='width:" + r.pct + "%'></i><b>" + r.pct + "%</b></span></button>";
    });
    if (!rows.length) h = "<div class='scempty'>" + (scan.run ? "جارٍ الفحص..." : scan.rows.length ? "لا نتائج بهذه الفلاتر" : "اضغط «ابدأ السكان» لفحص كل الفريمات") + "</div>";
    $("scan-list").innerHTML = h;
  }
  function scanGo(r) {
    if (!r) return;
    $("scanp").hidden = true;
    if (multiOn()) { paneCmd("tf", r.tf); tvToast("تم تغيير فريم الشاشة النشطة إلى " + (TV_LBL[r.tf] || r.tf) + ". فعّل المدرسة من Indicators"); return; }
    scanPend = r;
    if (r.tf === tf) scanApply();
    else { scanSkip = true; loadTF(r.tf); scanSkip = false; }
  }
  function scanApply() {
    var r = scanPend; scanPend = null;
    if (!r) return;
    if (r.school === "elliott") {
      ewFrozen = null; ewRange = null; if (ewPickStep) ewSelArm(false); ewSens = r.sens; ewAlt = r.alt; markSens();
      if (!ewOn) setEW(true);
      ewDirtyNow(); ewSyncTools();
    } else if (r.school === "harmonic") {
      var ty = hmTypeOf(r.name);
      hmType[ty] = true; hmOpt.bull = true; hmOpt.bear = true; hmOpt.done = true; hmOpt.forming = true;
      document.querySelectorAll("#hmtypes .chip").forEach(function (b, i) { b.setAttribute("aria-pressed", String(hmType[HM_TYPES[i]])); });
      if (!hmOn) setHM(true);
      hmSolo = r.key; hmUiSig = ""; ewDirtyNow();
    } else if (r.school === "ict") { if (!ictOn) setICT(true); ewDirtyNow(); }
    else { if (!msOn) setMS(true); ewDirtyNow(); }
    tvToast(SCAN_SCH[r.school][0] + " · " + r.name + " · " + r.pct + "%");
  }

  function tvInit() {
    if (PANE) paneReportInit();
    tvIcons(); tvBuildTf(); tvBuildType(); tvBuildInd(); tvLeftBuild(); tvTopBtns(); tvScaleBtns(); tvBuildRange(); tvBuildShot(); tvAlertInit(); scanBuild(); $("tv-theme").addEventListener("click", function () { tvTheme(THEME === "light" ? "dark" : "light"); }); tvTheme(THEME, true);
    tvReady = true;
    var st = "candle"; try { st = store.getItem("gold-type") || "candle"; } catch (e) {}
    if (st === "line" || st === "area" || st === "hollow") setType(st); else setType("candle");
    tvAfter(); tvLeftSync(); window.tvIndCount();
    document.addEventListener("click", function (ev) { if (!ev.target.closest(".tvl, #drmenu")) { var m = $("drmenu"); if (m && !m.hidden) m.hidden = true; } });
  }

  tvInit();
  loadTF(tf);
})();
</script>
