openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: access
    description: Email allowlist access gate
  - name: gold
    description: Gold market data
  - name: daily-analysis
    description: Arabic translation and source-based explanation of Trading Central reports
paths:
  /emails/translate:
    post:
      operationId: translateDailyAnalysis
      tags: [daily-analysis]
      summary: Translate a Trading Central report and generate a source-based explanation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyAnalysisTranslationInput"
      responses:
        "200":
          description: Arabic translation and additional report-based analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyAnalysisTranslation"
        "400":
          description: Invalid or oversized report
        "502":
          description: Translation provider failed or returned invalid output
        "503":
          description: AI translation is not configured
  /access/status:
    get:
      operationId: getAccessStatus
      tags: [access]
      summary: Check whether the browser has an active allowlisted access session
      responses:
        "200":
          description: Access state, without exposing the email allowlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessStatus"
        "503":
          description: Access list could not be checked; access remains closed
  /access/enter:
    post:
      operationId: enterWithAllowlistedEmail
      tags: [access]
      summary: Start a short-lived session when the submitted email is in the public allowlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessEmailRequest"
      responses:
        "200":
          description: Access granted; an HttpOnly session cookie is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessStatus"
        "400":
          description: Invalid email address
        "403":
          description: Email is not in the allowlist
        "503":
          description: Access list could not be checked; access remains closed
  /access/exit:
    post:
      operationId: exitAccessSession
      tags: [access]
      summary: Clear the browser's access session cookie
      responses:
        "204":
          description: Session ended
  /gold/history:
    get:
      operationId: getGoldHistory
      tags: [gold]
      summary: Independent real XAU/USD OHLC history, never TradingView widget data
      parameters:
        - in: query
          name: interval
          required: true
          schema:
            type: string
            enum: [1min, 5min, 15min, 30min, 45min, 1h, 2h, 4h, 8h, 1day, 1week, 1month]
      responses:
        "200":
          description: Actual provider bars sorted chronologically in UTC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldHistory"
        "400":
          description: Unsupported interval
        "429":
          description: Provider or server rate limit
        "502":
          description: Invalid or unavailable upstream data
        "503":
          description: Missing server credentials
  /gold/paxg/klines:
    get:
      operationId: getPaxgKlines
      tags: [gold]
      summary: Fetch Binance PAXG/USDT klines through the authenticated server
      parameters:
        - in: query
          name: interval
          required: true
          schema:
            type: string
            enum: [1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 6h, 8h, 12h, 1d, 3d, 1w, 1M]
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 }
        - in: query
          name: startTime
          required: false
          schema: { type: integer, minimum: 0 }
        - in: query
          name: endTime
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Validated PAXG/USDT candles from Binance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaxgKlinesResponse"
        "400":
          description: Invalid interval or pagination parameters
        "429":
          description: Binance request limit reached
        "502":
          description: Binance data is unavailable or invalid
  /gold/binance/klines:
    get:
      operationId: getBinanceKlines
      tags: [gold]
      summary: Fetch allowlisted Binance spot or futures candles through the authenticated server
      parameters:
        - in: query
          name: market
          required: true
          schema: { type: string, enum: [spot, futures] }
        - in: query
          name: symbol
          required: true
          schema: { type: string, enum: [XAUUSDT, XAGUSDT, BTCUSDT, PAXGUSDT] }
        - in: query
          name: interval
          required: true
          schema:
            type: string
            enum: [1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 6h, 8h, 12h, 1d, 3d, 1w, 1M]
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 }
        - in: query
          name: startTime
          required: false
          schema: { type: integer, minimum: 0 }
        - in: query
          name: endTime
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Validated candles from the requested allowlisted Binance market
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BinanceKlinesResponse"
        "400":
          description: Invalid market, symbol, interval, or pagination parameters
        "429":
          description: Binance request limit reached
        "502":
          description: Binance data is unavailable or invalid
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    DailyAnalysisSourceCard:
      type: object
      required: [id, assetName, timeframe, pivot, watchText, preference, alternative, comment, direction]
      properties:
        id: { type: string, maxLength: 128 }
        assetName: { type: string, maxLength: 120 }
        timeframe: { type: string, maxLength: 80 }
        pivot: { type: string, maxLength: 300 }
        watchText: { type: string, maxLength: 3000 }
        preference: { type: string, maxLength: 5000 }
        alternative: { type: string, maxLength: 5000 }
        comment: { type: string, maxLength: 8000 }
        direction: { type: string, enum: [bullish, bearish, neutral] }
    DailyAnalysisTranslationInput:
      type: object
      required: [subject, session, cards]
      properties:
        subject: { type: string, maxLength: 500 }
        session: { type: string, maxLength: 120 }
        cards:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/DailyAnalysisSourceCard"
    DailyAnalysisTranslatedCard:
      type: object
      required: [id, watchText, preference, alternative, comment, extraAnalysis]
      properties:
        id: { type: string, maxLength: 128 }
        watchText: { type: string, maxLength: 3000 }
        preference: { type: string, maxLength: 5000 }
        alternative: { type: string, maxLength: 5000 }
        comment: { type: string, maxLength: 8000 }
        extraAnalysis: { type: string, maxLength: 1500 }
    DailyAnalysisTranslation:
      type: object
      required: [subject, session, reportInsight, cards]
      properties:
        subject: { type: string, maxLength: 500 }
        session: { type: string, maxLength: 120 }
        reportInsight: { type: string, maxLength: 2000 }
        cards:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/DailyAnalysisTranslatedCard"
    AccessStatus:
      type: object
      required: [authorized]
      properties:
        authorized: { type: boolean }
    AccessEmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    GoldBar:
      type: object
      required: [time, open, high, low, close]
      properties:
        time:
          type: integer
          description: UTC Unix seconds at candle OPEN, not quote-update time
        open: { type: number }
        high: { type: number }
        low: { type: number }
        close: { type: number }
    GoldHistory:
      type: object
      required: [symbol, source, interval, timezone, currency, unit, fetchedAt, refreshSeconds, discardedBars, dataQualityNote, bars]
      properties:
        symbol: { type: string }
        source: { type: string }
        interval: { type: string }
        timezone: { type: string }
        currency: { type: string }
        unit: { type: string }
        fetchedAt: { type: string, format: date-time }
        refreshSeconds: { type: integer }
        discardedBars:
          type: integer
          description: Historical provider rows omitted for invalid OHLC or ambiguous duplicate times
        dataQualityNote: { type: string }
        bars:
          type: array
          items:
            $ref: "#/components/schemas/GoldBar"
    PaxgKlinesResponse:
      type: object
      required: [symbol, interval, bars]
      properties:
        symbol: { type: string, const: PAXGUSDT }
        interval:
          type: string
          enum: [1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 6h, 8h, 12h, 1d, 3d, 1w, 1M]
        bars:
          type: array
          items:
            $ref: "#/components/schemas/PaxgKline"
    PaxgKline:
      type: object
      required: [openTime, open, high, low, close, volume]
      properties:
        openTime: { type: integer, description: Binance candle opening time in milliseconds since Unix epoch }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        close: { type: number }
        volume: { type: number }
    BinanceKlinesResponse:
      type: object
      required: [symbol, market, interval, bars]
      properties:
        symbol:
          type: string
          enum: [XAUUSDT, XAGUSDT, BTCUSDT, PAXGUSDT]
        market: { type: string, enum: [spot, futures] }
        interval:
          type: string
          enum: [1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 6h, 8h, 12h, 1d, 3d, 1w, 1M]
        bars:
          type: array
          items:
            $ref: "#/components/schemas/BinanceKline"
    BinanceKline:
      type: object
      required: [openTime, open, high, low, close, volume]
      properties:
        openTime: { type: integer, description: Binance candle opening time in milliseconds since Unix epoch }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        close: { type: number }
        volume: { type: number }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

